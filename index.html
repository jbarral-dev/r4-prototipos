<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prototipos R4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/tokens/tokens.css" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/components/pendientes/R4NavigationItems.css" />
  <style>
    .indice { max-width: calc(var(--spacing-12) * 12); margin: 0 auto; padding: var(--spacing-12) var(--spacing-6); }
    .indice h1 { margin: 0 0 var(--spacing-2); font-family: var(--font-family-headings); font-size: var(--size-heading-l); line-height: var(--line-height-heading-l); }
    .indice p { margin: 0 0 var(--spacing-6); color: var(--text-subdued); }
    .indice h2 { margin: var(--spacing-8) 0 var(--spacing-3); font-family: var(--font-family-headings); font-size: var(--size-heading-s); line-height: var(--line-height-heading-s); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { createApp } from './vendor/vue.esm-browser.prod.js'
    import R4NavigationItems from './src/components/pendientes/R4NavigationItems.js'

    // Cada prototipo vive en su carpeta (<nombre>/). Al crear uno nuevo, se añade aquí. Iconos: los de Figma ya registrados (elección provisional).
    const grupos = [
      { titulo: 'Investigación', items: [
        { title: 'Buscador unificado · variante F', description: 'Conversación primero, sin pestañas', icon: 'ic-comments-alt', linkHref: 'buscador-f/' },
        { title: 'Buscador unificado · variante E', description: 'Tabs Buscador | Chat', icon: 'ic-search-ai', linkHref: 'buscador-e/' },
      ] },
      { titulo: 'Fichas de producto', items: [
        { title: 'Ficha de acción', description: 'Desktop y mobile', icon: 'ic-file-alt', linkHref: 'ficha-accion/' },
      ] },
      { titulo: 'Procesos', items: [
        { title: 'Doble factor · vincular app', icon: 'ic-info-circle', linkHref: 'doble-factor/' },
        { title: 'Alta de cuenta · datos de contacto', icon: 'ic-paper-plane', linkHref: 'alta-cuenta/' },
      ] },
    ]

    createApp({
      components: { R4NavigationItems },
      setup: () => ({ grupos }),
      template: `
        <main class="indice">
          <h1>Prototipos R4</h1>
          <p>Prototipos funcionales (provisionales) construidos con los componentes reconstruidos del Design System. Cada uno tiene su propia dirección.</p>
          <section v-for="g in grupos" :key="g.titulo">
            <h2>{{ g.titulo }}</h2>
            <R4NavigationItems size="medium" :items="g.items" :aria-label="g.titulo" />
          </section>
        </main>`,
    }).mount('#app')

    // Compatibilidad con los enlaces antiguos (…/#buscador-f): redirigen a la dirección propia del prototipo
    const antiguo = location.hash.replace('#', '')
    if (['doble-factor', 'alta-cuenta', 'ficha-accion', 'buscador-e', 'buscador-f'].includes(antiguo)) location.replace(antiguo + '/' + location.search)
  </script>
</body>
</html>
