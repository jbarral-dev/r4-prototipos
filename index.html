<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prototipos R4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/tokens/tokens.css" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/styles/componentes.css" />
  <style>
    /* Página de la portada: contenedor `r4page` (como las Templates) para que los modos de Layout y Typography respondan a su ancho */
    .portada { container-type: inline-size; container-name: r4page; min-height: 100vh; background: var(--surface-page); }
    /* Contenido a 6 de 12 columnas (desktop) · 6 de 8 (tablet) · 4 de 4 (mobile), centrado: R4Wrapper layout="6" (mismo criterio que las páginas de proceso) */
    .portada__contenido { display: flex; flex-direction: column; gap: var(--r4-wrapper-gap); } /* espacio entre bloques = el del Wrapper (48 / 40 / 32) */
    .portada__estado { margin: 0; color: var(--text-subdued); font-family: var(--font-family-body); font-size: var(--size-body-m); line-height: var(--line-height-body-m); }
    .portada__estado[hidden] { display: none; }
    /* El slot de R4Section alinea a la izquierda y los hijos encogen: la lista ocupa todo el ancho */
    .portada__contenido .r4-section__slot > nav { width: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { createApp, ref, computed } from './vendor/vue.esm-browser.prod.js'
    import R4InputSearch from './src/components/pendientes/R4InputSearch.js'
    import R4Wrapper from './src/components/pendientes/R4Wrapper.js'
    import R4PageTitleSection from './src/components/pendientes/R4PageTitleSection.js'
    import R4Section from './src/components/pendientes/R4Section.js'
    import R4NavigationItems from './src/components/pendientes/R4NavigationItems.js'

    // Cada prototipo vive en su carpeta (<nombre>/). Al crear uno nuevo, se añade aquí. Iconos: los de Figma ya registrados (elección provisional).
    const grupos = [
      { titulo: 'Chatbot', items: [
        { title: 'Buscador unificado · variante F', description: 'Conversación primero, sin pestañas', icon: 'ic-comments-alt', linkHref: 'buscador-f/' },
        { title: 'Buscador unificado · variante E', description: 'Tabs Buscador | Chat', icon: 'ic-search-ai', linkHref: 'buscador-e/' },
      ] },
      { titulo: 'Fichas de producto', items: [
        { title: 'Ficha de acción', icon: 'ic-file-alt', linkHref: 'ficha-accion/' },
        { title: 'Ficha de acción (CAIFE)', icon: 'ic-file-alt', linkHref: 'ficha-accion-caife/' },
      ] },
      { titulo: 'Navegación', items: [
        { title: 'Menú hamburguesa (Cliente logado)', description: 'v1 · enfoque anterior · solo mobile', icon: 'ic-bars', linkHref: 'navegacion/menu-hamburguesa-logado/' },
        { title: 'Menú hamburguesa (Cliente logado) · v2', description: 'Nuevo enfoque (reunión 04/11) · solo mobile', icon: 'ic-bars', linkHref: 'navegacion/menu-hamburguesa-logado-v2/' },
        { title: 'Menú hamburguesa con idiomas (Luxemburgo)', description: 'v1 · enfoque anterior · solo mobile · usuario potencial', icon: 'ic-bars', linkHref: 'navegacion/menu-hamburguesa-idiomas/' },
        { title: 'Menú hamburguesa con idiomas (Luxemburgo) · v2', description: 'Nuevo enfoque (reunión 04/11) · solo mobile · usuario potencial', icon: 'ic-bars', linkHref: 'navegacion/menu-hamburguesa-idiomas-v2/' },
      ] },
      { titulo: 'Procesos', items: [
        { title: 'Doble factor · vincular app', icon: 'ic-info-circle', linkHref: 'doble-factor/' },
        { title: 'Alta de cuenta · datos de contacto', icon: 'ic-paper-plane', linkHref: 'alta-cuenta/' },
      ] },
    ]

    // Filtro: a partir de 3 letras, sin distinguir mayúsculas ni tildes. Si coincide el título del grupo se muestra entero; si no, solo los enlaces que coinciden (título o descripción)
    const MIN_LETRAS = 3
    const normalizar = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()

    createApp({
      components: { R4Wrapper, R4PageTitleSection, R4Section, R4NavigationItems, R4InputSearch },
      setup: () => {
        const busqueda = ref('')
        const consulta = computed(() => normalizar(busqueda.value.trim()))
        const gruposVisibles = computed(() => {
          const q = consulta.value
          if (q.length < MIN_LETRAS) return grupos
          return grupos.map((g) => {
            if (normalizar(g.titulo).includes(q)) return g
            const items = g.items.filter((i) => normalizar(i.title + ' ' + (i.description || '')).includes(q))
            return { ...g, items }
          }).filter((g) => g.items.length)
        })
        const estado = computed(() => {
          if (consulta.value.length < MIN_LETRAS) return ''
          const n = gruposVisibles.value.reduce((t, g) => t + g.items.length, 0)
          return n ? `${n} ${n === 1 ? 'prototipo' : 'prototipos'}` : 'Sin resultados'
        })
        return { busqueda, gruposVisibles, estado }
      },
      template: `
        <div class="portada">
          <div class="r4-layout-modes">
            <main>
              <R4Wrapper density="default" layout="6">
                  <div class="portada__contenido">
                    <R4PageTitleSection title="Prototipos R4" description="Prototipos funcionales (provisionales) construidos con los componentes reconstruidos del Design System. Cada uno tiene su propia dirección." />
                    <R4InputSearch v-model="busqueda" placeholder="Buscar prototipo" aria-label="Filtrar prototipos" :show-close="false" />
                    <p class="portada__estado" role="status" aria-live="polite" :hidden="!estado">{{ estado }}</p>
                    <R4Section v-for="g in gruposVisibles" :key="g.titulo" appearance="boxed" background-color="white" :title="g.titulo">
                      <R4NavigationItems size="medium" :icon-is-boxed="false" :items="g.items" :aria-label="g.titulo" />
                    </R4Section>
                  </div>
              </R4Wrapper>
            </main>
          </div>
        </div>`,
    }).mount('#app')

    // Compatibilidad con los enlaces antiguos (…/#buscador-f): redirigen a la dirección propia del prototipo
    const antiguo = location.hash.replace('#', '')
    if (['doble-factor', 'alta-cuenta', 'ficha-accion', 'buscador-e', 'buscador-f'].includes(antiguo)) location.replace(antiguo + '/' + location.search)
  </script>
</body>
</html>
